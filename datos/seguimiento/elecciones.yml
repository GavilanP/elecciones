# Legislaturas y elecciones que se siguen. Periodo: desde el 2 de junio de 2018.
#
# legislaturas:
#   - id: XIV                 # numeración oficial del parlamento
#     ambito: congreso
#     inicio: AAAA-MM-DD      # sesión constitutiva
#     fin: AAAA-MM-DD         # disolución (vacío si sigue en curso)
#     seguimiento_desde: AAAA-MM-DD   # opcional: si empezó antes del periodo seguido
#     gobierno:               # opcional: quién gobernaba (para distinguir gobierno/oposición)
#       - { partidos: [id, ...], desde: AAAA-MM-DD, hasta: AAAA-MM-DD }
#
# elecciones:
#   - id: generales-2019-11   # se usa en programas/, relaciones/ y analisis/
#     ambito: congreso
#     fecha: AAAA-MM-DD
#     legislatura: XIV        # la legislatura que salió de esa elección

legislaturas:
  - id: XII
    ambito: congreso
    inicio: 2016-07-19
    fin: 2019-03-05
    seguimiento_desde: 2018-06-02   # moción de censura: Pedro Sánchez presidente
    gobierno:
      - { partidos: [pp], desde: 2016-11-04, hasta: 2018-06-01 }
      - { partidos: [psoe], desde: 2018-06-02 }
  - id: XIII
    ambito: congreso
    inicio: 2019-05-21
    fin: 2019-09-24
    gobierno:
      - { partidos: [psoe], desde: 2019-05-21 }   # en funciones
  - id: XIV
    ambito: congreso
    inicio: 2019-12-03
    fin: 2023-05-30
    gobierno:
      - { partidos: [psoe], desde: 2019-12-03, hasta: 2020-01-12 }   # en funciones
      - { partidos: [psoe, unidas-podemos], desde: 2020-01-13 }      # gobierno de coalición
  - id: XV
    ambito: congreso
    inicio: 2023-08-17
    fin:              # en curso (hay votaciones en septiembre de 2026)
    gobierno:
      - { partidos: [psoe, unidas-podemos], desde: 2023-08-17, hasta: 2023-11-20 }   # en funciones
      - { partidos: [psoe, sumar], desde: 2023-11-21 }

elecciones:
  # La XII salió de las generales de 2016: su programa es el que se contrasta con
  # lo votado entre junio de 2018 y marzo de 2019.
  - id: generales-2016
    ambito: congreso
    fecha: 2016-06-26
    legislatura: XII
  - id: generales-2019-04
    ambito: congreso
    fecha: 2019-04-28
    legislatura: XIII
  - id: generales-2019-11
    ambito: congreso
    fecha: 2019-11-10
    legislatura: XIV
  - id: generales-2023
    ambito: congreso
    fecha: 2023-07-23
    legislatura: XV

- { ambito: congreso, legislatura: XII, grupo: GP, nombre: Grupo Popular, partidos: [pp] }
- { ambito: congreso, legislatura: XII, grupo: GCUP-EC-EM, nombre: Grupo Confederal Unidos Podemos-En Comú Podem-En Marea, partidos: [unidas-podemos] }
- { ambito: congreso, legislatura: XII, grupo: GCs, nombre: Grupo Ciudadanos, partidos: [cs] }
- { ambito: congreso, legislatura: XII, grupo: GER, nombre: Grupo de Esquerra Republicana, partidos: [erc] }
- { ambito: congreso, legislatura: XII, grupo: GV (EAJ-PNV), nombre: Grupo Vasco (EAJ-PNV), partidos: [pnv] }

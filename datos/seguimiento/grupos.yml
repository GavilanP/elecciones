# Correspondencia grupo parlamentario → partido(s), por ámbito y legislatura.
# El voto oficial se publica por diputado y grupo; esta tabla permite pasarlo a partido.
# `grupo` es el código EXACTO de los datos oficiales (en el Congreso: GS, GP, GMx…);
# `nombre` es solo para leerlo.
#
# - ambito: congreso
#   legislatura: XIV
#   grupo: GS
#   nombre: Grupo Socialista
#   partidos: [psoe]          # un solo partido: todos sus diputados cuentan para él
#
# Grupos con varios partidos (p. ej. el Mixto): se reparte diputado a diputado.
#
# - ambito: congreso
#   legislatura: XIV
#   grupo: GMx
#   nombre: Grupo Mixto
#   diputados:
#     "Apellidos, Nombre": partido-id

# Los grupos con varios partidos (Mixto y, en la XIV, Plural) se reparten diputado a
# diputado, con el nombre tal y como viene en los datos oficiales. El valor puede ser:
#   - el id de un partido;
#   - «ninguno»: diputado sin partido (expulsado, no adscrito…); su voto no se atribuye;
#   - una lista de tramos con fechas: [{ partido: upn, hasta: 2022-02-14 }, { partido: ninguno, desde: 2022-02-15 }]
# `python3 scripts/agregar_votos.py` lista los diputados que faltan.
#
# Grupo «?»: así vienen los diputados que votan antes de tener grupo. Se les asigna solo el
# grupo en el que aparecen el resto de la legislatura; si estuvieron en varios, hay que
# añadir una entrada `grupo: "?"` con `diputados`.
#
# PENDIENTE DE VERIFICAR (no se asigna hasta tener fuente):
#   - XIV GMx: Sayas López y García Adanero (Navarra Suma → expulsados de UPN en 2022: falta la fecha).
#   - XIV GMx: Pita Cárdenes (procedía del grupo de Unidas Podemos).
#   - XIV GPlu: Bel Accensi, Cañadell Salvia, Miquel i Valentí, Boadella Esteve
#     (elegidos en JxCat; fecha de su paso a PDeCAT por confirmar).

# ── Congreso, XII legislatura (seguida desde el 2 de junio de 2018) ─────────────

# Correspondencia grupo parlamentario → partido(s), por ámbito y legislatura.
# El voto oficial se publica por diputado y grupo; esta tabla permite pasarlo a partido.
# `grupo` es el código EXACTO de los datos oficiales (en el Congreso: GS, GP, GMx…);
# `nombre` es solo para leerlo.
#
# - ambito: congreso
#   legislatura: XIV
#   grupo: GS
#   nombre: Grupo Socialista
#   partidos: [psoe]          # un solo partido: todos sus diputados cuentan para él
#
# Grupos con varios partidos (p. ej. el Mixto): se reparte diputado a diputado.
#
# - ambito: congreso
#   legislatura: XIV
#   grupo: GMx
#   nombre: Grupo Mixto
#   diputados:
#     "Apellidos, Nombre": partido-id

# Los grupos con varios partidos (Mixto y, en la XIV, Plural) se reparten diputado a
# diputado. Sus listas se rellenan con lo que muestra `python3 scripts/agregar_votos.py`
# tras la primera descarga (nombres tal y como vienen en los datos oficiales).

# ── Congreso, XII legislatura (seguida desde el 2 de junio de 2018) ─────────────
- { ambito: congreso, legislatura: XII, grupo: GS, nombre: Grupo Socialista, partidos: [psoe] }
- { ambito: congreso, legislatura: XII, grupo: GP, nombre: Grupo Popular, partidos: [pp] }
- { ambito: congreso, legislatura: XII, grupo: GCUP-EC-EM, nombre: Grupo Confederal Unidos Podemos-En Comú Podem-En Marea, partidos: [unidas-podemos] }
- { ambito: congreso, legislatura: XII, grupo: GCs, nombre: Grupo Ciudadanos, partidos: [cs] }
- { ambito: congreso, legislatura: XII, grupo: GER, nombre: Grupo de Esquerra Republicana, partidos: [erc] }
- { ambito: congreso, legislatura: XII, grupo: GV (EAJ-PNV), nombre: Grupo Vasco (EAJ-PNV), partidos: [pnv] }
- { ambito: congreso, legislatura: XII, grupo: GMx, nombre: Grupo Mixto, diputados: {} }

